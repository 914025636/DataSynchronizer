<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>事件秒级 K 线预览</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; background: #131722; color: #d1d4dc; }
  aside { width: 300px; flex: none; border-right: 1px solid #2a2e39; display: flex; flex-direction: column; }
  aside header { padding: 10px; border-bottom: 1px solid #2a2e39; }
  aside h1 { margin: 0 0 8px; font-size: 14px; }
  #search { width: 100%; padding: 6px 8px; background: #1e222d; border: 1px solid #2a2e39; border-radius: 4px; color: inherit; }
  #list { overflow: auto; flex: 1; }
  .item { padding: 8px 10px; border-bottom: 1px solid #1e222d; cursor: pointer; }
  .item:hover { background: #1e222d; }
  .item[aria-current="true"] { background: #2962ff22; border-left: 3px solid #2962ff; padding-left: 7px; }
  .item b { display: block; font-weight: 600; }
  .item span { color: #868993; font-size: 12px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  main header { padding: 10px 14px; border-bottom: 1px solid #2a2e39; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #title { font-size: 15px; font-weight: 600; }
  #stats { color: #868993; display: flex; gap: 14px; flex-wrap: wrap; }
  #stats b { color: #d1d4dc; font-weight: 600; }
  .spacer { margin-left: auto; }
  button, select { background: #1e222d; border: 1px solid #2a2e39; color: inherit; border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled), select:hover { border-color: #4a4f5c; }
  button:disabled { opacity: .4; cursor: default; }
  #chart { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  canvas.dragging { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; background: #1e222dee; border: 1px solid #2a2e39; border-radius: 4px; padding: 6px 8px; font-size: 12px; white-space: pre; display: none; }
  #note { padding: 6px 14px; border-top: 1px solid #2a2e39; color: #868993; font-size: 12px; }
  #error { margin: 20px; padding: 12px; border: 1px solid #ef5350; border-radius: 4px; color: #ef5350; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>事件列表（<span id="count">0</span>）</h1>
    <input id="search" type="search" placeholder="搜索事件或日期" autocomplete="off">
  </header>
  <div id="list"></div>
</aside>
<main>
  <header>
    <span id="title">加载中…</span>
    <div id="stats"></div>
    <div class="spacer"></div>
    <label>周期 <select id="bucket">
      <option value="1" selected>1 秒</option>
      <option value="5">5 秒</option>
      <option value="15">15 秒</option>
      <option value="60">1 分钟</option>
    </select></label>
    <button id="prev" title="上一条（←）">上一条</button>
    <button id="next" title="下一条（→）">下一条</button>
  </header>
  <div id="chart"><canvas id="canvas"></canvas><div id="tip"></div></div>
  <div id="note"></div>
  <div id="error"></div>
</main>
<script>
const DIR = (new URLSearchParams(location.search).get('dir') || 'binance-btcusdt-spot-1s-us-important-events-2026-09-07').replace(/[^\w.-]/g, '');
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const MIN_VISIBLE = 10;
let events = [], filtered = [], current = -1, candles = [], rawRows = [], layout = null, hover = -1;
let view = { start: 0, count: 0 };

const visible = () => candles.slice(view.start, view.start + view.count);
function resetView() { view = { start: 0, count: candles.length }; hover = -1; }
function panTo(start) { view.start = Math.round(Math.min(candles.length - view.count, Math.max(0, start))); }

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  text = text.replace(/^\ufeff/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((k, i) => [k, r[i]])));
}

async function loadCsv(name) {
  const response = await fetch(DIR + '/' + encodeURIComponent(name), { cache: 'no-store' });
  if (!response.ok) throw new Error(name + ' 读取失败：HTTP ' + response.status);
  return parseCsv(await response.text());
}

function fail(error) {
  $('error').style.display = 'block';
  $('error').textContent = '无法加载数据：' + error.message + '\n请确认已通过预览服务器打开本页面。';
}

const beijing = iso => new Date(iso).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });

function renderList() {
  const keyword = $('search').value.trim().toLowerCase();
  filtered = events.filter(e => !keyword || (e.events_zh + ' ' + e.event_time_utc + ' ' + beijing(e.event_time_utc)).toLowerCase().includes(keyword));
  $('count').textContent = filtered.length;
  $('list').innerHTML = '';
  filtered.forEach((item, index) => {
    const node = document.createElement('div');
    node.className = 'item';
    node.setAttribute('aria-current', String(index === current));
    const name = document.createElement('b');
    name.textContent = item.events_zh;
    const time = document.createElement('span');
    time.textContent = beijing(item.event_time_utc) + '（北京时间）';
    node.append(name, time);
    node.onclick = () => select(index);
    $('list').append(node);
  });
}

function aggregate(rows, size) {
  const out = [];
  for (let i = 0; i < rows.length; i += size) {
    const slice = rows.slice(i, i + size);
    out.push({
      second: Number(slice[0].relative_seconds),
      open: Number(slice[0].open), close: Number(slice[slice.length - 1].close),
      high: Math.max(...slice.map(r => Number(r.high))), low: Math.min(...slice.map(r => Number(r.low))),
      volume: slice.reduce((sum, r) => sum + Number(r.volume_btc), 0),
    });
  }
  return out;
}

function draw() {
  const ratio = devicePixelRatio || 1;
  const width = canvas.clientWidth, height = canvas.clientHeight;
  canvas.width = width * ratio; canvas.height = height * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const shown = visible();
  if (!shown.length) return;
  const left = 8, right = width - 66, top = 14, volumeTop = height - 74, bottom = height - 26;
  const high = Math.max(...shown.map(c => c.high)), low = Math.min(...shown.map(c => c.low));
  const pad = (high - low) * 0.08 || 1;
  const maxVolume = Math.max(...shown.map(c => c.volume)) || 1;
  const step = (right - left) / shown.length;
  const y = price => volumeTop - 8 - (price - low + pad) / (high - low + pad * 2) * (volumeTop - 8 - top);
  layout = { left, right, top, bottom, step, y };

  ctx.strokeStyle = '#2a2e39'; ctx.fillStyle = '#868993'; ctx.font = '11px sans-serif'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const price = low - pad + (high - low + pad * 2) * i / 4, py = Math.round(y(price)) + .5;
    ctx.beginPath(); ctx.moveTo(left, py); ctx.lineTo(right, py); ctx.stroke();
    ctx.fillText(price.toFixed(2), right + 6, py);
  }
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  const spanMinutes = (shown[shown.length - 1].second - shown[0].second) / 60;
  const tick = [1, 2, 5, 10, 30].find(minutes => spanMinutes / minutes <= 10) || 60;
  for (let minute = Math.ceil(shown[0].second / 60 / tick) * tick; minute * 60 <= shown[shown.length - 1].second; minute += tick) {
    const index = shown.findIndex(c => c.second >= minute * 60);
    if (index < 0) continue;
    ctx.fillText((minute > 0 ? '+' : '') + minute + '分', left + (index + .5) * step, bottom + 4);
  }
  ctx.textAlign = 'left';

  shown.forEach((candle, index) => {
    const x = left + index * step, mid = x + step / 2;
    const color = candle.close >= candle.open ? '#26a69a' : '#ef5350';
    ctx.fillStyle = color; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(Math.round(mid) + .5, y(candle.high)); ctx.lineTo(Math.round(mid) + .5, y(candle.low)); ctx.stroke();
    const openY = y(candle.open), closeY = y(candle.close);
    ctx.fillRect(x + step * .15, Math.min(openY, closeY), Math.max(step * .7, 1), Math.max(Math.abs(closeY - openY), 1));
    const volumeHeight = candle.volume / maxVolume * (bottom - volumeTop);
    ctx.globalAlpha = .5; ctx.fillRect(x + step * .15, bottom - volumeHeight, Math.max(step * .7, 1), volumeHeight); ctx.globalAlpha = 1;
  });

  const zero = shown.findIndex(c => c.second >= 0);
  if (zero >= 0 && shown[0].second <= 0) {
    const px = Math.round(left + zero * step) + .5;
    ctx.strokeStyle = '#f5c542'; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#f5c542'; ctx.fillText('公布时刻', px + 4, top);
  }
  if (hover >= 0 && hover < shown.length) {
    const px = Math.round(left + (hover + .5) * step) + .5;
    ctx.strokeStyle = '#4a4f5c';
    ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke();
  }
}

// Coalesce redraws so dragging stays smooth with 5400 one-second candles.
let pending = 0;
function render() {
  if (pending) return;
  pending = requestAnimationFrame(() => { pending = 0; draw(); });
}

function showStats(rows) {
  const eventIndex = rows.findIndex(r => Number(r.relative_seconds) === 0);
  const base = Number(rows[eventIndex].open);
  const before = Number(rows[0].open), after = Number(rows[rows.length - 1].close);
  const highest = Math.max(...rows.map(r => Number(r.high))), lowest = Math.min(...rows.map(r => Number(r.low)));
  const percent = value => ((value / base - 1) * 100).toFixed(2) + '%';
  $('stats').innerHTML = '';
  [['公布时价格', base.toFixed(2)], ['前30分钟', before.toFixed(2) + '（' + percent(before) + '）'],
   ['后60分钟', after.toFixed(2) + '（' + percent(after) + '）'], ['窗口最高', highest.toFixed(2)], ['窗口最低', lowest.toFixed(2)],
   ['振幅', ((highest / lowest - 1) * 100).toFixed(2) + '%']].forEach(([label, value]) => {
    const node = document.createElement('span');
    node.append(label + ' ');
    const strong = document.createElement('b'); strong.textContent = value; node.append(strong);
    $('stats').append(node);
  });
}

async function select(index) {
  if (index < 0 || index >= filtered.length) return;
  current = index;
  renderList();
  const active = $('list').querySelector('[aria-current="true"]');
  if (active) active.scrollIntoView({ block: 'nearest' });
  const item = filtered[index];
  $('title').textContent = item.events_zh;
  $('prev').disabled = index === 0;
  $('next').disabled = index === filtered.length - 1;
  try {
    rawRows = await loadCsv(item.file);
    candles = aggregate(rawRows, Number($('bucket').value));
    resetView();
    showStats(rawRows);
    $('note').textContent = '公布时间 ' + beijing(item.event_time_utc) + '（北京时间） · ' + item.event_time_utc + ' · 币安 BTC/USDT 现货 · ' +
      rawRows.length + ' 根秒线聚合为 ' + candles.length + ' 根 · 滚轮缩放，按住拖动平移，双击还原 · 文件 ' + item.file;
    draw();
  } catch (error) { fail(error); }
}

let drag = null;
canvas.addEventListener('mousedown', event => {
  if (event.button !== 0 || !layout) return;
  drag = { x: event.clientX, start: view.start };
  canvas.classList.add('dragging');
  $('tip').style.display = 'none';
});
addEventListener('mouseup', () => { drag = null; canvas.classList.remove('dragging'); });

canvas.addEventListener('mousemove', event => {
  if (!layout || !candles.length) return;
  if (drag) {
    panTo(drag.start - (event.clientX - drag.x) / layout.step);
    hover = -1;
    render();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const index = Math.floor((x - layout.left) / layout.step);
  hover = index >= 0 && index < view.count ? index : -1;
  const tip = $('tip');
  if (hover < 0) { tip.style.display = 'none'; render(); return; }
  const candle = visible()[hover];
  const sign = candle.second >= 0 ? '+' : '';
  tip.textContent = '距公布 ' + sign + candle.second + ' 秒\n开 ' + candle.open.toFixed(2) + '\n高 ' + candle.high.toFixed(2) +
    '\n低 ' + candle.low.toFixed(2) + '\n收 ' + candle.close.toFixed(2) + '\n量 ' + candle.volume.toFixed(5) + ' BTC';
  tip.style.display = 'block';
  tip.style.left = Math.min(x + 14, rect.width - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(event.clientY - rect.top + 14, rect.height - tip.offsetHeight - 8) + 'px';
  render();
});
canvas.addEventListener('mouseleave', () => { if (drag) return; hover = -1; $('tip').style.display = 'none'; render(); });
canvas.addEventListener('wheel', event => {
  if (!layout || !candles.length) return;
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.min(Math.max((event.clientX - rect.left - layout.left) / (layout.right - layout.left), 0), 1);
  const anchor = view.start + ratio * view.count;
  const count = Math.round(Math.min(candles.length, Math.max(MIN_VISIBLE, view.count * (event.deltaY < 0 ? 0.8 : 1.25))));
  view.count = count;
  panTo(anchor - ratio * count);
  hover = -1;
  $('tip').style.display = 'none';
  render();
}, { passive: false });
canvas.addEventListener('dblclick', () => { resetView(); $('tip').style.display = 'none'; render(); });
$('bucket').onchange = () => { if (rawRows.length) { candles = aggregate(rawRows, Number($('bucket').value)); resetView(); render(); } };
$('prev').onclick = () => select(current - 1);
$('next').onclick = () => select(current + 1);
$('search').oninput = () => { renderList(); if (filtered.length) select(0); };
addEventListener('keydown', event => {
  if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') return;
  if (event.key === 'ArrowLeft') select(current - 1);
  if (event.key === 'ArrowRight') select(current + 1);
});
addEventListener('resize', render);

loadCsv('index.csv').then(rows => {
  events = rows.filter(row => row.status === 'complete');
  renderList();
  if (events.length) select(0); else fail(new Error('index.csv 中没有可用的行情表'));
}).catch(fail);
</script>
</body>
</html>
