services:
  redis:
    image: redis:7-alpine
    container_name: datasynchronizer-redis
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    ports:
      - '9000:9000'   # HTTP REST API + ILP over HTTP
      - '9009:9009'   # InfluxDB Line Protocol (TCP)
      - '18812:8812'  # PostgreSQL wire protocol (8812 is reserved by Windows on some hosts)
    volumes:
      - questdb_data:/var/lib/questdb
    environment:
      - QDB_TELEMETRY_ENABLED=false
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - '8080:80'
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: ${MYSQL_PORT:-3306}
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASS}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  redis_data:
  questdb_data:
  grafana_data:
